[project]
name = "evidoc-local"
version = "0.1.0"
description = "Local evidence-first Chinese document Q&A on an 8 GB GPU"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.3",
  "httpx==0.28.1",
  "numpy==2.2.6",
  "pypdf==6.0.0",
  "python-docx==1.2.0",
  "python-multipart==0.0.20",
  "pydantic==2.11.7",
  "psutil==7.2.2",
]

[dependency-groups]
dev = ["pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

